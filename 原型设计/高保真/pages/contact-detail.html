<script>
// Tab 切换（极简演示）
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(x=>x.style.display='none');
  t.classList.add('active');
  document.getElementById(t.dataset.t).style.display='block';
});
</script>
<!--
设计说明（contact-detail.html）
对应需求：第五章 页面 15 联系人详情 /contact/detail/:id
关键交互点：
1. 左右分栏（1:2）：左栏基础信息（头像/在职状态/决策权/手机脱敏）+ 就职历史时间轴（当前绿点/历史灰点）+ 变更历史留痕。
2. 手机号"申请变更"走 D14：需经理审核，审核期间原号码冻结 24 小时；姓名/邮箱/微信编辑直接生效。
3. 右栏 3 Tab：跨公司跟单聚合时间轴 / 关联公司卡（当前+历史就职）/ 关系网络。
4. V2.5 数据层：本页由 CRM.data.contacts 渲染；邮箱/微信 DB 无字段故占位保留编辑入口；DB 未录多段就职与关系网络明细，故以"DB 未录明细"空态注明（刻意保留）。
-->
<script src="../assets/app.js"></script>
<script>
// V2.5 数据层：联系人详情改为 CRM.data.contacts / follows / relations 驱动
(function () {
  'use strict';
  var D = CRM.data, H = CRM.h;

  function qp(n) {
    var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  var CONT = H.byId(D.contacts, qp('id')) || D.contacts[0];
  var COMP = H.byId(D.companies, CONT.companyId) || null;

  function labelOf(list, code) { var x = H.byCode(list, code); return x ? (x.label || x.name) : code; }
  function decRoleName(code) { var x = H.byCode(D.decisionRole, code); return x ? x.name : '—'; }
  function relsOfCompany(cid) { return D.relations.filter(function (r) { return r.companyId === cid; }); }

  /* ---------- 左栏基础信息 ---------- */
  document.getElementById('ctAv').textContent = (CONT.name || '?').charAt(0);
  document.getElementById('ctName').textContent = CONT.name;
  var statusTag = CONT.status === 'active'
    ? '<span class="tag tag-green tag-dot">在职</span>'
    : '<span class="tag tag-dot">已离职</span>';
  var roleTag = '<span class="tag tag-orange">' + H.esc(decRoleName(CONT.decisionRole)) + '</span>';
  document.getElementById('ctTags').innerHTML = statusTag + roleTag;
  document.getElementById('ctCompanyLine').textContent =
    (COMP ? COMP.fullName + ' · ' : '') + (CONT.title || '');
  document.getElementById('ctPhone').textContent = CONT.phoneMasked || '—';
  document.getElementById('ctEmail').textContent = '—';
  document.getElementById('ctWechat').textContent = '—';
  document.getElementById('ctPersonalTags').innerHTML = (CONT.personalTags || []).length
    ? CONT.personalTags.map(function (t) {
        return '<span class="tag tag-blue">' + H.esc(t) + ' ✕</span>';
      }).join('') + '<a class="btn-text">+ 添加</a>'
    : '<span class="text-sub">—</span><a class="btn-text">+ 添加</a>';

  /* ---------- 谈判特质留痕（跟着人走，换公司保留） ---------- */
  var traitHtml = (CONT.traitCodes || []).length
    ? CONT.traitCodes.map(function (code) {
        return '<span class="tag" style="background:#F0F9EB;color:#67C23A">' + H.esc(labelOf(D.contactTraits, code)) + '</span>';
      }).join(' ')
    : '—';
  document.getElementById('ctTraitsBox').innerHTML =
    '<div class="sub-title">谈判特质 <span class="text-sub fs12">（≤3 · 换公司保留）</span></div>' +
    '<div class="flex gap8" style="flex-wrap:wrap;margin-top:-6px">' + traitHtml + '</div>' +
    '<div class="fs12 text-sub" style="margin-top:6px">' + H.esc((CONT.markedBy || '—')) + ' 于 ' + H.esc((CONT.markedAt || '—')) + ' 打标</div>';

  /* ---------- 就职历史 ---------- */
  var hist = document.getElementById('ctHistory');
  var active = CONT.status === 'active';
  var dotCls = active ? 'text-success' : '';
  if (COMP) {
    var timeHtml = active
      ? '入职至今 · <span class="' + dotCls + '">●</span> 当前在职'
      : '在职期间 · <span style="color:#C0C4CC">●</span> 已离职';
    hist.innerHTML =
      '<div class="tl-item" style="--tl-c:var(--success)">' +
        '<div class="tl-time">' + timeHtml + '</div>' +
        '<div class="tl-body">' + H.esc(COMP.fullName) + ' · ' + H.esc(CONT.title || '—') + '</div>' +
      '</div>';
    if ((CONT.companyCount || 1) > 1) {
      hist.innerHTML += '<div class="tl-item"><div class="tl-time" style="color:#C0C4CC">● 历史</div>' +
        '<div class="tl-body text-sub">另有 ' + ((CONT.companyCount || 1) - 1) + ' 段历史就职（DB 未录明细，V2.5 刻意保留）</div></div>';
    }
  } else {
    hist.innerHTML = '<div class="text-sub" style="padding:8px 0">暂无就职记录</div>';
  }

  /* ---------- 变更历史 ---------- */
  document.getElementById('ctChangeLog').innerHTML =
    '2026-08-12 手机号变更（经理审核通过）· 操作人：' + H.esc(CONT.markedBy || '—');

  /* ---------- Tab1 跨公司跟单聚合 ---------- */
  var relByRelId = {};
  D.relations.forEach(function (r) { relByRelId[r.id] = r; });
  var feeds = D.follows.filter(function (f) { return f.contactName === CONT.name; })
    .slice().sort(function (a, b) { return b.followAt < a.followAt ? -1 : (b.followAt > a.followAt ? 1 : 0); });
  document.getElementById('tFeedBody').innerHTML = feeds.length ? feeds.map(function (f) {
    var rel = relByRelId[f.relationId] || {};
    return '<div class="tl-item">' +
      '<div class="tl-time">' + H.esc(f.followAt) + ' · ' + H.esc(f.creatorName) +
        ' · ' + H.esc(f.companyName) + (rel.productLineName ? ' / ' + H.esc(rel.productLineName) : '') + '</div>' +
      '<div class="tl-body">' + H.esc(f.summary || '—') + '</div></div>';
  }).join('') : '<div class="empty" style="padding:24px 0">暂无跟单记录</div>';

  /* ---------- Tab2 关联公司 ---------- */
  document.getElementById('cntComp').textContent = CONT.companyCount || (COMP ? 1 : 0);
  var compBody = document.getElementById('tCompBody');
  if (COMP) {
    var rels = relsOfCompany(COMP.id);
    var compTag = CONT.status === 'active'
      ? '<span class="tag tag-green">当前在职</span>'
      : '<span class="tag">历史就职</span>';
    var lineText = rels.length
      ? rels.map(function (r) {
          var s = H.byCode(D.relationStatus, r.status);
          return '<span>' + H.esc(r.productLineName) + '（' + H.esc(s ? s.name : r.status) + '）</span>';
        }).join('')
      : '<span class="text-sub">暂无业务线</span>';
    compBody.innerHTML =
      '<div class="bcard">' +
        '<div class="b-title">' + H.esc(COMP.fullName) + ' ' + compTag + '</div>' +
        '<div class="b-meta">' +
          '<span>职务：' + H.esc(CONT.title || '—') + ' · 决策权：' + H.esc(decRoleName(CONT.decisionRole)) + '</span>' +
          '<span>业务线：</span>' + lineText +
        '</div></div>' +
        (((CONT.companyCount || 1) > 1)
          ? '<div class="bcard"><div class="b-meta"><span class="text-sub">另有 ' + ((CONT.companyCount || 1) - 1) + ' 段历史就职公司（DB 未录明细）</span></div></div>'
          : '');
  } else {
    compBody.innerHTML = '<div class="card" style="grid-column:1/-1"><div class="empty" style="padding:24px 0">暂无关联公司</div></div>';
  }
})();
</script>
