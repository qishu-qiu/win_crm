<!-- 设计说明：对应需求文档「页面 19/20 工单管理 - 列表 /workorder/list」。
     要点：类型 Tab（全部/售后/商机）+ 状态/优先级筛选；「新建工单」打开 D11 创建抽屉；
     类型 tag（售后橙/商机蓝）；优先级 P0 红(4h)/P1 橙(8h)/P2 蓝(24h)/P3 灰(72h)，商机工单无优先级与 SLA；
     SLA 剩余 <20% 红色倒计时「剩 1.2h」+ danger 进度条；状态按 创建→分派→处理中→客户确认→已关闭 五色状态点；每页 20。 -->
<script src="../assets/app.js"></script>
<script>
// V2.5 数据层：工单列表改为 CRM.data.workorders 驱动
// - 类型：aftersale 售后 / opportunity 商机；状态（页内映射，DB 无字典）：assigned 已分派 / processing 处理中 / confirming 客户确认 / closed 已关闭
// - 优先级 P0~P3 配色取自 dict woPriority；SLA 剩余 = slaDeadline - NOW('2026-09-07 09:00')，商机工单不计 SLA
(function () {
  'use strict';
  var D = CRM.data, H = CRM.h;
  var NOW = '2026-09-07 09:00';
  var state = { tab: 'all', st: '', pr: '', kw: '' };
  var WO_ST = { assigned: { t: '已分派', c: 's-data' }, processing: { t: '处理中', c: 's-intent' }, confirming: { t: '客户确认', c: 's-renew' }, closed: { t: '已关闭', c: 's-customer' } };
  // SLA 总时长按优先级（代码内置演示常量，与页面注释一致 P0 4h/P1 8h/P2 24h/P3 72h）
  var PRI_H = { P0: 4, P1: 8, P2: 24, P3: 72 };
  var PRI_C = { P0: 'tag-red', P1: 'tag-orange', P2: 'tag-blue', P3: 'tag' };
  function esc(v) { return H.esc(v); }
  function empByName(name) {
    if (!name) return null;
    for (var i = 0; i < D.employees.length; i++) if (D.employees[i].name === name) return D.employees[i];
    return null;
  }
  function personChip(name) {
    var e = empByName(name);
    if (!e) return esc(name || '—');
    var cls = 'r-delivery', label = '交付';
    if (e.roleCodes.indexOf('sale') >= 0) { cls = 'r-sales'; label = '销售'; }
    else if (e.roleCodes.indexOf('service') >= 0) { cls = 'r-service'; label = '客服'; }
    return H.personChip(e.name, e.av, cls, label);
  }
  function typeTag(w) {
    return w.type === 'opportunity'
      ? '<span class="tag tag-blue">商机</span>'
      : '<span class="tag tag-orange">售后</span>';
  }
  function slaCell(w) {
    if (!w.slaDeadline || w.type === 'opportunity') {
      return '<td class="text-sub">不计 SLA</td>';
    }
    var total = PRI_H[w.priority] || 8;
    var remain = (new Date(w.slaDeadline.replace(/-/g, '/')) - new Date(NOW.replace(/-/g, '/'))) / 3600000;
    var pct = Math.max(0, Math.min(100, total ? (remain / total) * 100 : 0));
    if (remain < 0) {
      return '<td class="sla-cell"><span class="text-danger bold">已超时</span><div class="progress danger"><i style="width:100%"></i></div></td>';
    }
    var cls = pct < 20 ? 'danger' : (pct < 50 ? 'warn' : '');
    var warn = pct < 20 ? 'text-danger bold' : (pct < 50 ? '' : '');
    return '<td class="sla-cell"><span class="' + warn + '">剩 ' + (Math.round(remain * 10) / 10) + 'h</span><div class="progress ' + cls + '"><i style="width:' + pct + '%"></i></div></td>';
  }
  function stCell(code) {
    var s = WO_ST[code];
    if (!s) return '<td><span class="text-sub">' + esc(code) + '</span></td>';
    return '<td><span class="status-dot ' + s.c + '">' + s.t + '</span></td>';
  }
  function rowHtml(w) {
    var pr = w.priority
      ? '<span class="tag ' + (PRI_C[w.priority] || 'tag') + '">' + esc(w.priority) + '</span>'
      : '<span class="text-sub">—</span>';
    return '<tr>' +
      '<td class="cell-main"><a data-jump="workorder-detail.html?id=' + esc(w.id) + '">' + esc(w.orderNo) + '</a></td>' +
      '<td>' + typeTag(w) + '</td>' +
      '<td>' + esc(w.companyName) + '</td>' +
      '<td>' + esc(w.title) + '</td>' +
      '<td>' + esc(w.source || '—') + '</td>' +
      '<td>' + personChip(w.assigneeName) + '</td>' +
      '<td>' + pr + '</td>' +
      slaCell(w) +
      stCell(w.status) +
      '</tr>';
  }
  function matched() {
    return D.workorders.filter(function (w) {
      if (state.tab !== 'all' && w.type !== state.tab) return false;
      if (state.st && w.status !== state.st) return false;
      if (state.pr && w.priority !== state.pr) return false;
      if (state.kw && (w.orderNo + w.companyName + w.title).indexOf(state.kw) < 0) return false;
      return true;
    });
  }
  function render() {
    var rows = matched();
    var tb = document.getElementById('woTbody');
    tb.innerHTML = rows.length
      ? rows.map(rowHtml).join('')
      : '<tr><td colspan="9" class="text-sub" style="text-align:center;padding:24px">暂无符合条件的数据</td></tr>';
    var pt = document.getElementById('woTotal');
    if (pt) pt.textContent = '共 ' + rows.length + ' 条';
    // Tab 计数随数据
    var tabs = document.getElementById('woTabs');
    if (tabs) {
      var ts = tabs.querySelectorAll('.tab');
      for (var i = 0; i < ts.length; i++) {
        var v = ts[i].getAttribute('data-t');
        var cnt = ts[i].querySelector('.count');
        if (cnt) cnt.textContent = D.workorders.filter(function (w) { return v === 'all' || w.type === v; }).length;
        ts[i].className = 'tab' + (state.tab === v ? ' active' : '');
      }
    }
  }
  function fillSels() {
    var st = document.getElementById('woSt');
    if (st) st.innerHTML = '<option value="">全部状态</option>' + Object.keys(WO_ST).map(function (k) {
      return '<option value="' + esc(k) + '">' + esc(WO_ST[k].t) + '</option>';
    }).join('');
    var pr = document.getElementById('woPr');
    if (pr) pr.innerHTML = '<option value="">全部优先级</option>' + D.woPriority.map(function (p) {
      return '<option value="' + esc(p.code) + '">' + esc(p.code) + '（' + esc(PRI_H[p.code] || '') + 'h）</option>';
    }).join('');
  }
  var tabsEl = document.getElementById('woTabs');
  if (tabsEl) {
    var tEls = tabsEl.querySelectorAll('.tab');
    for (var i = 0; i < tEls.length; i++) {
      tEls[i].addEventListener('click', function () {
        state.tab = this.getAttribute('data-t');
        render();
      });
    }
  }
  document.getElementById('woBtnQ').addEventListener('click', function () {
    state.st = document.getElementById('woSt').value;
    state.pr = document.getElementById('woPr').value;
    state.kw = (document.getElementById('woKw').value || '').trim();
    render();
  });
  document.getElementById('woBtnR').addEventListener('click', function () {
    document.getElementById('woSt').value = '';
    document.getElementById('woPr').value = '';
    document.getElementById('woKw').value = '';
    state.st = state.pr = state.kw = '';
    render();
  });
  fillSels();
  render();
})();
</script>
