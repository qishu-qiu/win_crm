<!--
设计说明（contact-list.html）
对应需求：第五章 页面 14 联系人档案列表 /contact/list
关键交互点：
1. 双列卡片网格：姓名+在职状态徽标（在职绿/已离职灰）、决策权 tag（决策人/影响人/执行人）、关联公司数、手机脱敏、谈判特质、个人标签、当前/历史就职（历史灰字）。
2. 筛选：在职状态/决策权角色；搜索姓名/手机号（防抖 300ms）。
3. 点击卡片进详情 contact-detail.html。
4. V2.5 数据层：卡片来自 CRM.data.contacts（currentCompany 经 companyId 反查 companies）；分页页码/每页条数为静态演示；"换公司保留"提示刻意保留。
-->
<script src="../assets/app.js"></script>
<script>
// V2.5 数据层：联系人档案列表改为 CRM.data.contacts 驱动渲染
(function () {
  'use strict';
  var D = CRM.data, H = CRM.h;
  var state = { status: '', role: '', kw: '' };

  /* V2.5 数据层：决策权下拉选项来自 CRM.data.decisionRole */
  var fRole = document.getElementById('fRole');
  fRole.innerHTML = '<option value="">全部决策权角色</option>' + D.decisionRole.map(function (x) {
    return '<option value="' + H.esc(x.code) + '">' + H.esc(x.name) + '</option>';
  }).join('');

  function labelOf(list, code) { var x = H.byCode(list, code); return x ? (x.label || x.name) : code; }
  function decRoleName(code) { var x = H.byCode(D.decisionRole, code); return x ? x.name : '—'; }
  function companyOf(c) { return H.byId(D.companies, c.companyId); }

  function matched() {
    return D.contacts.filter(function (c) {
      if (state.status && c.status !== state.status) return false;
      if (state.role && c.decisionRole !== state.role) return false;
      if (state.kw && (c.name + c.phoneMasked).indexOf(state.kw) < 0) return false;
      return true;
    });
  }

  function cardHtml(c) {
    var roleCls = c.decisionRole === 'decision' ? 'dt-boss' : (c.decisionRole === 'influence' ? 'dt-inf' : 'dt-exec');
    var statusTag = c.status === 'active'
      ? '<span class="tag tag-green">在职</span>'
      : '<span class="tag">已离职</span>';
    var comp = companyOf(c);
    var compLine = comp
      ? (c.status === 'active'
          ? '<span>当前就职：' + H.esc(comp.fullName) + '（' + H.esc(c.title || '—') + '）</span>'
          : '<span class="text-sub">历史就职：' + H.esc(comp.fullName) + '（' + H.esc(c.title || '—') + '）</span>')
      : '<span>就职公司：<span class="text-sub">—</span></span>';

    var traitChips = (c.traitCodes || []).map(function (code) {
      return '<span class="tag" style="background:#F0F9EB;color:#67C23A">' + H.esc(labelOf(D.contactTraits, code)) + '</span>';
    }).join('');
    var perTags = (c.personalTags || []).map(function (t) {
      return '<span class="tag tag-blue">' + H.esc(t) + '</span>';
    }).join('');

    return '<div class="bcard" onclick="location.href=\'contact-detail.html?id=' + H.esc(c.id) + '\'">' +
      '<div class="b-title">' + H.esc(c.name) + ' ' + statusTag + ' <span class="dec-tag ' + roleCls + '">' + H.esc(decRoleName(c.decisionRole)) + '</span></div>' +
      '<div class="b-meta">' +
        '<span>手机：<span class="masked">' + H.esc(c.phoneMasked) + '</span></span>' +
        compLine +
        '<span>关联公司：' + H.esc(c.companyCount) + ' 家</span>' +
        (traitChips || perTags
          ? '<span class="flex gap8" style="flex-wrap:wrap">' + traitChips + perTags + '</span>'
          : '<span class="text-sub">暂无特质/个人标签</span>') +
      '</div></div>';
  }

  function render() {
    var rows = matched();
    var grid = document.getElementById('clGrid');
    grid.innerHTML = rows.length ? rows.map(cardHtml).join('') : '<div class="bcard"><div class="b-meta"><span>暂无数据</span></div></div>';
    var t1 = document.getElementById('ctTotal');
    if (t1) t1.textContent = '共 ' + rows.length + ' 位联系人';
    var t2 = document.getElementById('clPageTotal');
    if (t2) t2.textContent = '共 ' + rows.length + ' 条';
  }

  document.getElementById('btnQuery').addEventListener('click', function () {
    state.status = document.getElementById('fStatus').value;
    state.role = document.getElementById('fRole').value;
    state.kw = (document.getElementById('fKw').value || '').trim();
    render();
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    document.getElementById('fStatus').value = '';
    document.getElementById('fRole').value = '';
    document.getElementById('fKw').value = '';
    state.status = state.role = state.kw = '';
    render();
  });

  render();
})();
</script>
