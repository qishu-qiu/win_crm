<!-- 设计说明：对应需求文档「页面 24 组织架构 - 员工管理 /org/employee」。
     要点：筛选=部门/角色/状态+姓名工号搜索；角色多标签（销售+部门经理同一人）；主部门唯一、兼部门用于跨部门协同；
     停用员工灰显、名下业务关系需先转交；新增/编辑弹窗含角色多选与关联产品线勾选（本页未展开演示）。 -->
<script src="../assets/app.js"></script>
<script>
/* ============================================================
 * V2.5 数据层：员工列表 = CRM.data.employees 渲染 + 真实筛选
 * 只读演示：行按钮（编辑/停用/启用）由 app.js 按文本语义兜底。
 * ============================================================ */
(function () {
  'use strict';
  var C = window.CRM;
  if (!C || !C.data) return;
  var emps = C.data.employees || [];
  var depts = C.data.departments || [];
  var roles = C.data.roles || [];

  var tb = document.getElementById('tb-emp');
  var totalEl = document.getElementById('emp-total');
  var pageTotalEl = document.getElementById('emp-page-total');
  var fDept = document.getElementById('f-dept');
  var fRole = document.getElementById('f-role');
  var fStatus = document.getElementById('f-status');
  var fKw = document.getElementById('f-keyword');
  var btnQ = document.getElementById('btn-query');
  var btnR = document.getElementById('btn-reset');
  if (!tb) return;

  function roleName(code) {
    for (var i = 0; i < roles.length; i++) { if (roles[i].code === code) return roles[i].name; }
    return code;
  }
  function deptName(id) {
    // deptId=0 的赵总归口总部（DB 中 总部 为部门父级名）
    if (String(id) === '0') return '总部';
    for (var i = 0; i < depts.length; i++) { if (String(depts[i].id) === String(id)) return depts[i].name; }
    return '—';
  }
  function esc(s) { return String(s === null || s === undefined ? '' : s); }

  function rowHtml(e) {
    var isActive = e.status === 'active';
    var nameHtml = '<span class="person-chip mini"><i class="pc-avatar ' + esc(e.av || 'av0') + '">' +
      esc((e.name || '?').charAt(0)) + '</i><span class="pc-name">' + esc(e.name || '—') + '</span></span>';
    var roleHtml = (e.roleCodes || []).map(function (c) {
      return '<span class="tag tag-blue">' + esc(roleName(c)) + '</span>';
    }).join(' ');
    var statusHtml = isActive ? '<span class="tag tag-green tag-dot">在职</span>' : '<span class="tag tag-dot">停用</span>';
    var ops = '<button class="btn-text">编辑</button>' +
      (isActive ? '<button class="btn-text danger">停用</button>' : '<button class="btn-text">启用</button>');
    return '<tr>' +
      '<td>' + nameHtml + '</td>' +
      '<td class="num">' + esc(e.workNo || '—') + '</td>' +
      '<td><span class="entity-tag dept"><i class="et-icon">🏢</i>' + esc(deptName(e.deptId)) + '</span></td>' +
      '<td>' + (roleHtml || '<span class="text-sub">—</span>') + '</td>' +
      '<td>' + esc(e.phone || '—') + '</td>' +
      '<td>' + statusHtml + '</td>' +
      '<td>' + ops + '</td>' +
      '</tr>';
  }

  function emptyRow() {
    return '<tr><td colspan="7" class="text-sub" style="text-align:center;padding:24px 0">暂无数据</td></tr>';
  }

  function render() {
    var kw = (fKw ? fKw.value.trim() : '').toLowerCase();
    var dv = fDept ? fDept.value : '';
    var rv = fRole ? fRole.value : '';
    var sv = fStatus ? fStatus.value : '';
    var rows = emps.filter(function (e) {
      if (dv && String(e.deptId) !== dv) return false;
      if (rv && (e.roleCodes || []).indexOf(rv) < 0) return false;
      if (sv === 'active' && e.status !== 'active') return false;
      if (sv === 'disabled' && e.status === 'active') return false;
      if (kw) {
        var hay = ((e.name || '') + ' ' + (e.workNo || '')).toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    });
    tb.innerHTML = rows.length ? rows.map(rowHtml).join('') : emptyRow();
    if (pageTotalEl) pageTotalEl.textContent = '共 ' + rows.length + ' 条';
  }

  // 下拉选项来自 DB（部门 / 角色）
  function fillOptions(sel, label, list, textOf, valOf) {
    var html = '<option value="">' + label + '</option>';
    list.forEach(function (it) {
      html += '<option value="' + esc(valOf(it)) + '">' + esc(textOf(it)) + '</option>';
    });
    sel.innerHTML = html;
  }
  if (fDept) fillOptions(fDept, '全部部门', depts, function (d) { return d.name; }, function (d) { return d.id; });
  if (fRole) fillOptions(fRole, '全部角色', roles, function (r) { return r.name; }, function (r) { return r.code; });

  if (totalEl) totalEl.textContent = '共 ' + emps.length + ' 名员工 · 角色可多选，主部门唯一，兼部门用于跨部门协同';
  render();

  // 阻止冒泡到 app.js 的通用兜底 toast；自身完成过滤
  function bind(id, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', function (e) { e.stopPropagation(); fn(); });
  }
  bind('btn-query', render);
  bind('btn-reset', function () {
    if (fDept) fDept.value = '';
    if (fRole) fRole.value = '';
    if (fStatus) fStatus.value = '';
    if (fKw) fKw.value = '';
    render();
  });
})();
</script>
