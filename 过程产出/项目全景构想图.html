<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售 CRM 项目全景构想图（公海模型）</title>
<style>
/* ───────────────────────────────────────────────────────────────
   设计令牌 = Ant Design 5 官方 token（数值唯一基准）
   真相源：《需求规格/销售CRM设计规范》V1.0 §二
   反 AI 味硬禁：渐变 / 玻璃拟态 / emoji / 发光 / 彩色阴影 / 夸张动画
   ─────────────────────────────────────────────────────────────── */
:root{
  --color-primary:#1677ff; --color-primary-bg:#e6f4ff; --color-primary-bg2:#bae0ff; --color-primary-dark:#003eb3;
  --color-success:#52c41a; --color-success-bg:#f6ffed; --color-success-bg2:#d9f7be; --color-success-dark:#237804;
  --color-purple:#722ed1;  --color-purple-bg:#f9f0ff;  --color-purple-dark:#391085;
  --color-gold:#faad14;    --color-gold-bg:#fffbe6;    --color-gold-dark:#ad6800;
  --color-cyan:#13c2c2;    --color-cyan-bg:#e6fffb;    --color-cyan-dark:#006d75;
  --color-error:#ff4d4f;   --color-error-bg:#fff1f0;   --color-error-dark:#a8071a;
  --color-bg-layout:#f5f5f5; --color-bg-container:#ffffff; --color-fill-quaternary:#fafafa;
  --color-border:#d9d9d9;  --color-border-secondary:#f0f0f0;
  --color-text:rgba(0,0,0,.88); --color-text-secondary:rgba(0,0,0,.65); --color-text-tertiary:rgba(0,0,0,.45);
  --radius-lg:8px; --radius-base:6px;
  --font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--color-bg-layout);color:var(--color-text);font-family:var(--font-family);}
.wrap{max-width:1240px;margin:0 auto;padding:32px 20px 48px;}
.page-title{text-align:center;margin-bottom:4px;}
.page-title h1{font-size:24px;font-weight:600;margin:0;color:var(--color-text);letter-spacing:.5px;}
.page-title p{font-size:14px;color:var(--color-text-secondary);margin:8px 0 0;}
.legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:16px 0 8px;}
.legend span{font-size:12px;color:var(--color-text-secondary);display:inline-flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;}
svg{width:100%;height:auto;display:block;background:var(--color-bg-container);
    border:1px solid var(--color-border-secondary);border-radius:var(--radius-lg);margin-top:8px;}
text{font-family:var(--font-family);}
.sec{font-size:16px;font-weight:600;fill:var(--color-text);}
.sec-note{font-size:12px;fill:var(--color-text-tertiary);}
.bt{font-size:14px;font-weight:600;fill:var(--color-text);}
.bs{font-size:12px;fill:var(--color-text-secondary);}
.bx{font-size:11px;fill:var(--color-text-tertiary);}
.nt{font-size:12px;fill:var(--color-text-secondary);}
.ntb{font-size:12px;font-weight:600;fill:var(--color-text);}
.foot{text-align:center;font-size:11px;color:var(--color-text-tertiary);margin-top:14px;line-height:1.9;}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-title">
    <h1>销售 CRM 项目 · 全景构想图</h1>
    <p>多业务线 × 多部门 × 多角色 · 以「业务关系」为最小单元 · 公海模型（公司档案 ＋ 业务关系 两层）</p>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--color-primary)"></i>核心数据模型</span>
    <span><i class="dot" style="background:var(--color-success)"></i>业务生命周期</span>
    <span><i class="dot" style="background:var(--color-purple)"></i>组织与权限</span>
    <span><i class="dot" style="background:var(--color-gold)"></i>技术架构</span>
    <span><i class="dot" style="background:var(--color-cyan)"></i>实施分期</span>
  </div>

<svg viewBox="0 0 1200 1560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="销售 CRM 项目全景构想图（公海模型）">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" style="stroke:var(--color-primary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" style="stroke:var(--color-error)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ════════════ ① 核心数据模型 · 公海模型（两层） ════════════ -->
  <text class="sec" x="48" y="56">① 核心数据模型 · 公海模型（两层）</text>
  <text class="sec-note" x="360" y="56">区别于传统 CRM「客户表多份」：公司档案全公司唯一，业务关系各自独立</text>

  <!-- 第 1 层 -->
  <rect x="60" y="74" width="744" height="66" rx="8" style="fill:var(--color-primary-bg);stroke:var(--color-primary);stroke-width:1.2"/>
  <text class="bt" x="80" y="100" style="fill:var(--color-primary-dark)">第 1 层 · 公司档案（＝ 公司公海）</text>
  <text class="bs" x="80" y="124">1 家公司 = 1 个档案（全称 / 统一社会信用代码唯一）· 全公司共享、全员可见，就是客户名单本身</text>

  <line x1="432" y1="140" x2="432" y2="164" style="stroke:var(--color-primary)" stroke-width="1.4" marker-end="url(#ar-blue)"/>
  <text class="bx" x="444" y="157">任何部门都可在其上激活「本部门 × 产品线」的关系</text>

  <!-- 第 2 层 -->
  <rect x="60" y="166" width="744" height="84" rx="8" style="fill:var(--color-primary-bg2);stroke:var(--color-primary);stroke-width:1.6"/>
  <text class="bt" x="80" y="192" style="fill:var(--color-primary-dark)">第 2 层 · 业务关系（CRM 最小业务单元）</text>
  <text class="bs" x="80" y="214" style="fill:rgba(0,0,0,.78)">公司 × 部门 × 产品线 × 归属销售 ｜ 部门公海里的一条，就是它（不是公司）</text>
  <text class="bs" x="80" y="236" style="fill:rgba(0,0,0,.78)">有 owner ＝ 本人私海 ／ 无 owner ＝ 掉公海（部门恒定不变）</text>

  <!-- 设计铁律 -->
  <rect x="828" y="74" width="312" height="176" rx="8" style="fill:var(--color-fill-quaternary);stroke:var(--color-border);stroke-width:1"/>
  <text class="ntb" x="848" y="100">设计铁律</text>
  <text class="nt" x="848" y="126">• 公司主档案唯一，不重复建</text>
  <text class="nt" x="848" y="150">• 部门公海 = 公司公海中本部门的关系集合</text>
  <text class="bx" x="848" y="169">（不是独立一层）</text>
  <text class="nt" x="848" y="194">• 业务关系是最小单元，可并行多条</text>
  <text class="nt" x="848" y="218">• 签单人锁业绩 · owner 管维护（离职不动业绩）</text>
  <text class="nt" x="848" y="242">• 对接人手机号唯一，跳槽留历史</text>

  <text class="bx" x="60" y="272">例：某教育客户可同时有「财税 / GEO / 网站」三条业务关系，各跟各的、互不干扰</text>

  <!-- ════════════ ② 业务全生命周期 ════════════ -->
  <text class="sec" x="48" y="330">② 业务全生命周期</text>

  <!-- 主干流程 7 步 -->
  <g>
    <rect x="62" y="350" width="136" height="66" rx="6" style="fill:var(--color-success-bg);stroke:var(--color-success);stroke-width:1.2"/>
    <text class="bt" x="130" y="382" text-anchor="middle" style="fill:var(--color-success-dark)" font-size="13">线索 / 联系人</text>
    <text class="bx" x="130" y="404" text-anchor="middle">手机号必填，可空公司</text>

    <line x1="200" y1="383" x2="216" y2="383" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="218" y="350" width="136" height="66" rx="6" style="fill:var(--color-success-bg);stroke:var(--color-success);stroke-width:1.2"/>
    <text class="bt" x="286" y="382" text-anchor="middle" style="fill:var(--color-success-dark)" font-size="13">建立业务关系</text>
    <text class="bx" x="286" y="404" text-anchor="middle">选定部门 × 产品线激活</text>

    <line x1="356" y1="383" x2="372" y2="383" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="374" y="350" width="136" height="66" rx="6" style="fill:var(--color-success-bg);stroke:var(--color-success);stroke-width:1.2"/>
    <text class="bt" x="442" y="382" text-anchor="middle" style="fill:var(--color-success-dark)" font-size="13">意向跟进 · 跟单</text>
    <text class="bx" x="442" y="404" text-anchor="middle">写跟单记录 / 约下次</text>

    <line x1="512" y1="383" x2="528" y2="383" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="530" y="350" width="136" height="66" rx="6" style="fill:var(--color-success-bg);stroke:var(--color-success);stroke-width:1.2"/>
    <text class="bt" x="598" y="382" text-anchor="middle" style="fill:var(--color-success-dark)" font-size="13">公司档案补全</text>
    <text class="bx" x="598" y="404" text-anchor="middle">成交前 / 后强制必填</text>

    <line x1="668" y1="383" x2="684" y2="383" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="686" y="350" width="136" height="66" rx="6" style="fill:var(--color-success-bg2);stroke:var(--color-success);stroke-width="1.6"/>
    <text class="bt" x="754" y="382" text-anchor="middle" style="fill:var(--color-success-dark)" font-size="13">签约成交 · 合同</text>
    <text class="bx" x="754" y="404" text-anchor="middle">业绩归签单人</text>

    <line x1="824" y1="383" x2="840" y2="383" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="842" y="350" width="136" height="66" rx="6" style="fill:var(--color-success-bg);stroke:var(--color-success);stroke-width:1.2"/>
    <text class="bt" x="910" y="382" text-anchor="middle" style="fill:var(--color-success-dark)" font-size="13">交付与回访 · 工单</text>
    <text class="bx" x="910" y="404" text-anchor="middle">售后 / 商机双分类</text>

    <line x1="980" y1="383" x2="996" y2="383" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="998" y="350" width="136" height="66" rx="6" style="fill:var(--color-success-bg);stroke:var(--color-success);stroke-width:1.2"/>
    <text class="bt" x="1066" y="382" text-anchor="middle" style="fill:var(--color-success-dark)" font-size="13">续约 / 流失</text>
    <text class="bx" x="1066" y="404" text-anchor="middle">owner 管维护</text>
  </g>

  <!-- 掉公海（只有一步） -->
  <text class="ntb" x="62" y="452">掉公海（只掉一步：有 owner → 无 owner，部门恒定不变）</text>

  <rect x="62" y="464" width="210" height="54" rx="6" style="fill:var(--color-fill-quaternary);stroke:var(--color-border);stroke-width:1"/>
  <text class="bt" x="167" y="488" text-anchor="middle" font-size="13">本人私海（有 owner）</text>
  <text class="bx" x="167" y="507" text-anchor="middle">跟进频次 / 成单周期不达标</text>

  <line x1="272" y1="491" x2="304" y2="491" style="stroke:var(--color-error)" stroke-width="1.4" marker-end="url(#ar-error)"/>

  <rect x="308" y="464" width="210" height="54" rx="6" style="fill:var(--color-error-bg);stroke:var(--color-error);stroke-width:1.2"/>
  <text class="bt" x="413" y="488" text-anchor="middle" style="fill:var(--color-error-dark)" font-size="13">掉公海（无 owner）</text>
  <text class="bx" x="413" y="507" text-anchor="middle">部门不变 · 本部门可再领取</text>

  <line x1="518" y1="491" x2="550" y2="491" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="554" y="464" width="210" height="54" rx="6" style="fill:var(--color-gold-bg);stroke:var(--color-gold);stroke-width:1.2"/>
  <text class="bt" x="659" y="488" text-anchor="middle" style="fill:var(--color-gold-dark)" font-size="13">经理决策待办</text>
  <text class="bx" x="659" y="507" text-anchor="middle">停留超期 → 保留 / 删除关系</text>

  <text class="bx" x="800" y="486">注意：客服 / 交付不触发掉落</text>
  <text class="bx" x="800" y="506">到期前 24h 预警，不「悄悄掉」</text>
  <text class="bx" x="800" y="526">判死 / 流失同样回公海，可重新领取</text>

  <!-- ════════════ ③ 组织角色与数据权限 ════════════ -->
  <text class="sec" x="48" y="580">③ 组织角色与数据权限</text>

  <!-- 组织树 -->
  <rect x="70" y="600" width="150" height="44" rx="6" style="fill:var(--color-purple-bg);stroke:var(--color-purple);stroke-width:1.4"/>
  <text class="bt" x="145" y="628" text-anchor="middle" style="fill:var(--color-purple-dark)">总经理</text>

  <line x1="145" y1="644" x2="110" y2="668" style="stroke:var(--color-border)" stroke-width="1.2"/>
  <line x1="145" y1="644" x2="330" y2="668" style="stroke:var(--color-border)" stroke-width="1.2"/>

  <rect x="40" y="668" width="140" height="42" rx="6" style="fill:var(--color-purple-bg);stroke:var(--color-purple);stroke-width:1.2"/>
  <text class="bt" x="110" y="694" text-anchor="middle" style="fill:var(--color-purple-dark)" font-size="13">经理 A</text>
  <rect x="260" y="668" width="140" height="42" rx="6" style="fill:var(--color-purple-bg);stroke:var(--color-purple);stroke-width:1.2"/>
  <text class="bt" x="330" y="694" text-anchor="middle" style="fill:var(--color-purple-dark)" font-size="13">经理 B</text>

  <line x1="110" y1="710" x2="110" y2="730" style="stroke:var(--color-border)" stroke-width="1.2"/>
  <line x1="330" y1="710" x2="330" y2="730" style="stroke:var(--color-border)" stroke-width="1.2"/>

  <rect x="36" y="730" width="148" height="40" rx="6" style="fill:var(--color-purple-bg);stroke:var(--color-purple);stroke-width:1"/>
  <text class="bx" x="110" y="754" text-anchor="middle" style="fill:var(--color-purple-dark)">销售 / 客服 / 交付 / 行政</text>
  <rect x="256" y="730" width="148" height="40" rx="6" style="fill:var(--color-purple-bg);stroke:var(--color-purple);stroke-width:1"/>
  <text class="bx" x="330" y="754" text-anchor="middle" style="fill:var(--color-purple-dark)">销售 / 客服 / 交付 / 行政</text>

  <text class="bx" x="48" y="792">部门 ↔ 产品线 = 多对多；总经理 ↔ 经理 = 多对多</text>

  <!-- 数据权限矩阵 -->
  <rect x="470" y="600" width="670" height="200" rx="8" style="fill:var(--color-fill-quaternary);stroke:var(--color-border);stroke-width:1"/>
  <text class="ntb" x="490" y="628">数据权限矩阵（核心规则）</text>
  <text class="nt" x="490" y="654">• 销售 = 本人私海（owner ＋ 协同）＋ 公海 ｜ 经理 = 管辖部门 ｜ 总经理 = 全公司</text>
  <text class="nt" x="490" y="680">• 他人私海一律不可见（除非协同 / @求助授权）</text>
  <text class="nt" x="490" y="706">• 跨业务线 / 跨部门自动脱敏：合同金额 · 续约日期 · 跟单内容 · 工单详情</text>
  <text class="nt" x="490" y="732">• 手机号：详情全可见 · 列表打码 · owner 可上锁（解锁由落锁人批）</text>
  <text class="nt" x="490" y="758">• 跨部门同产品线 = 竞争并行，跟单互不可见（防策略泄露）</text>
  <text class="nt" x="490" y="784">• 报表 / 看板金额不脱敏（管理出口看得见数才管得了盘）</text>

  <!-- ════════════ ④ 技术架构分层 ════════════ -->
  <text class="sec" x="48" y="860">④ 技术架构分层（定案：TypeScript 全栈）</text>

  <rect x="60" y="880" width="1080" height="50" rx="8" style="fill:var(--color-gold-bg);stroke:var(--color-gold);stroke-width:1.2"/>
  <text class="bt" x="80" y="910" style="fill:var(--color-gold-dark)" font-size="13">表现层（Frontend）</text>
  <text class="bs" x="300" y="910">Vue 3（TS）＋ Vite ＋ Ant Design Vue ｜ Web 后台 ＋ 移动端工作台</text>

  <line x1="600" y1="930" x2="600" y2="946" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="60" y="948" width="1080" height="50" rx="8" style="fill:var(--color-gold-bg);stroke:var(--color-gold);stroke-width:1.2"/>
  <text class="bt" x="80" y="978" style="fill:var(--color-gold-dark)" font-size="13">业务层（Backend）</text>
  <text class="bs" x="300" y="978">NestJS 12（Node ＋ TS）＋ Prisma ｜ 权限 · 公海规则 · 工单 · 合同 · 报表（REST ＋ OpenAPI）</text>

  <line x1="600" y1="998" x2="600" y2="1014" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="60" y="1016" width="1080" height="50" rx="8" style="fill:var(--color-gold-bg);stroke:var(--color-gold);stroke-width:1.2"/>
  <text class="bt" x="80" y="1046" style="fill:var(--color-gold-dark)" font-size="13">数据层（Storage）</text>
  <text class="bs" x="300" y="1046">MySQL 8（生成列唯一索引）＋ Redis（缓存 / 队列 / 定时掉公海）＋ 对象存储（MinIO / OSS）</text>

  <line x1="600" y1="1066" x2="600" y2="1082" style="stroke:var(--color-text-tertiary)" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="60" y="1084" width="1080" height="50" rx="8" style="fill:var(--color-bg-container);stroke:var(--color-gold);stroke-width:1.2;stroke-dasharray:6 4"/>
  <text class="bt" x="80" y="1114" style="fill:var(--color-gold-dark)" font-size="13">外部集成（V2）</text>
  <text class="bs" x="300" y="1114">企业微信 / 钉钉 ｜ 短视频 / GEO 平台数据同步 ｜ 财务系统</text>

  <!-- ════════════ ⑤ 实施分期 ════════════ -->
  <text class="sec" x="48" y="1190">⑤ 实施分期 · MVP → V2</text>

  <!-- MVP -->
  <rect x="60" y="1210" width="540" height="300" rx="8" style="fill:var(--color-cyan-bg);stroke:var(--color-cyan);stroke-width:1.4"/>
  <text class="bt" x="84" y="1242" style="fill:var(--color-cyan-dark)" font-size="15">第一期 · MVP（12 周，自研）</text>
  <text class="bs" x="84" y="1264" style="fill:var(--color-cyan-dark)">目标：把「人和人的对接」做成可落地资产，先跑通核心闭环</text>

  <rect x="84" y="1280" width="492" height="56" rx="6" style="fill:var(--color-bg-container);stroke:var(--color-cyan);stroke-width:1"/>
  <text class="ntb" x="98" y="1302" style="fill:var(--color-cyan-dark)">P0 核心闭环</text>
