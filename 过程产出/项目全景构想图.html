<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售 CRM 项目全景构想图</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f6fb;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #1f2937;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 60px; }
  .page-title { text-align: center; margin-bottom: 4px; }
  .page-title h1 { font-size: 22px; font-weight: 700; margin: 0; color: #0c447c; letter-spacing: 1px; }
  .page-title p { font-size: 13px; color: #6b7280; margin: 6px 0 0; }
  .legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin: 14px 0 4px; }
  .legend span { font-size: 12px; color: #4b5563; display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  svg { width: 100%; height: auto; display: block; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; margin-top: 8px; }
  text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .sec-title { font-size: 15px; font-weight: 700; fill: #111827; }
  .sec-num { font-size: 15px; font-weight: 700; }
  .box-t { font-size: 14px; font-weight: 600; fill: #111827; }
  .box-s { font-size: 11.5px; fill: #4b5563; }
  .box-xs { font-size: 10.5px; fill: #6b7280; }
  .note { font-size: 12px; fill: #374151; }
  .note-b { font-size: 12px; font-weight: 600; fill: #111827; }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-title">
    <h1>销售 CRM 项目 · 全景构想图</h1>
    <p>多业务线 × 多部门 × 多角色 · 以「业务关系」为最小单元 · 3 层映射数据模型</p>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#185FA5"></i>核心数据模型</span>
    <span><i class="dot" style="background:#3B6D11"></i>业务生命周期</span>
    <span><i class="dot" style="background:#534AB7"></i>组织与权限</span>
    <span><i class="dot" style="background:#BA7517"></i>技术架构</span>
    <span><i class="dot" style="background:#0F6E56"></i>实施分期</span>
  </div>

<svg viewBox="0 0 1200 1580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="销售CRM项目全景构想图">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============ SECTION 1: 3层映射架构 ============ -->
  <text class="sec-title" x="40" y="58">① 核心数据模型 · 3 层映射架构</text>
  <text class="box-xs" x="360" y="58">区别于传统 CRM「客户表多份」，本系统公司主档案唯一、业务关系独立</text>

  <!-- Layer 1 -->
  <rect x="60" y="78" width="760" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text class="box-t" x="80" y="104" fill="#0c447c">第 1 层 · 公司公海（企业主档案池）</text>
  <text class="box-s" x="80" y="126">1 家公司 = 1 个档案（公司全称 / 社会统一代码唯一索引，全部门共享）</text>

  <!-- arrow down -->
  <line x1="440" y1="140" x2="440" y2="156" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- Layer 2 -->
  <rect x="60" y="158" width="760" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text class="box-t" x="80" y="184" fill="#0c447c">第 2 层 · 部门公海 + 员工私海</text>
  <text class="box-s" x="80" y="206">部门主动认领的有价值客户 ／ 员工从部门公海认领到自己名下的客户</text>

  <line x1="440" y1="220" x2="440" y2="236" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- Layer 3 -->
  <rect x="60" y="238" width="760" height="62" rx="10" fill="#cfe3f7" stroke="#185FA5" stroke-width="1.6"/>
  <text class="box-t" x="80" y="264" fill="#0c447c">第 3 层 · 业务关系（CRM 最小业务单元）</text>
  <text class="box-s" x="80" y="286">企业 × 部门 × 产品线 × 对接人 × 销售 ｜ 一切跟单 / 合同 / 续约围绕它展开</text>

  <!-- Key principles note -->
  <rect x="852" y="78" width="308" height="222" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <text class="note-b" x="872" y="104">设计铁律（4 条）</text>
  <text class="note" x="872" y="130">• 公司主档案唯一，不重复建</text>
  <text class="note" x="872" y="156">• 部门公海 ≠ 公司公海子集</text>
  <text class="note" x="872" y="182">• 业务关系是最小单元（可并行多条）</text>
  <text class="note" x="872" y="208">• 签单人≠维护人：离职不影响业绩</text>
  <text class="note" x="872" y="234">• 对接人手机号唯一，跳槽留历史</text>
  <text class="box-xs" x="872" y="286" fill="#9ca3af">（XX 教育可同时有财税 / GEO / 网站 3 条业务关系）</text>

  <!-- ============ SECTION 2: 业务全生命周期 ============ -->
  <text class="sec-title" x="40" y="384">② 业务全生命周期流程</text>

  <!-- Flow boxes -->
  <g>
    <rect x="60" y="404" width="150" height="70" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
    <text class="box-t" x="135" y="430" text-anchor="middle" fill="#27500a">线索 / 联系人</text>
    <text class="box-xs" x="135" y="452" text-anchor="middle">手机号必填，可空公司</text>

    <line x1="210" y1="439" x2="216" y2="439" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

    <rect x="216" y="404" width="150" height="70" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
    <text class="box-t" x="291" y="430" text-anchor="middle" fill="#27500a">建立业务关系</text>
    <text class="box-xs" x="291" y="452" text-anchor="middle">选定部门 × 产品线激活</text>

    <line x1="366" y1="439" x2="372" y2="439" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

    <rect x="372" y="404" width="150" height="70" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
    <text class="box-t" x="447" y="430" text-anchor="middle" fill="#27500a">意向跟进 · 跟单</text>
    <text class="box-xs" x="447" y="452" text-anchor="middle">写跟单记录 / 约下次</text>

    <line x1="522" y1="439" x2="528" y2="439" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

    <rect x="528" y="404" width="150" height="70" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
    <text class="box-t" x="603" y="430" text-anchor="middle" fill="#27500a">公司档案补全</text>
    <text class="box-xs" x="603" y="452" text-anchor="middle">成交前 / 后强制必填</text>

    <line x1="678" y1="439" x2="684" y2="439" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

    <rect x="684" y="404" width="150" height="70" rx="9" fill="#d7ecc0" stroke="#3B6D11" stroke-width="1.6"/>
    <text class="box-t" x="759" y="430" text-anchor="middle" fill="#27500a">签约成交 · 合同</text>
    <text class="box-xs" x="759" y="452" text-anchor="middle">业绩归属签单人</text>

    <line x1="834" y1="439" x2="840" y2="439" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

    <rect x="840" y="404" width="150" height="70" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
    <text class="box-t" x="915" y="430" text-anchor="middle" fill="#27500a">交付与回访 · 工单</text>
    <text class="box-xs" x="915" y="452" text-anchor="middle">售后 / 商机双分类</text>

    <line x1="990" y1="439" x2="996" y2="439" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

    <rect x="996" y="404" width="150" height="70" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
    <text class="box-t" x="1071" y="430" text-anchor="middle" fill="#27500a">续约 / 流失</text>
    <text class="box-xs" x="1071" y="452" text-anchor="middle">维护人持续跟进</text>
  </g>

  <!-- 公海掉落 loop -->
  <text class="note-b" x="60" y="512">↻ 公海自动掉落（按业务关系维度触发）</text>
  <rect x="60" y="524" width="180" height="52" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
  <text class="box-t" x="150" y="548" text-anchor="middle" fill="#791F1F" font-size="13">员工私海</text>
  <text class="box-xs" x="150" y="567" text-anchor="middle">跟进频次/成单周期不达标</text>

  <line x1="240" y1="550" x2="276" y2="550" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="276" y="524" width="180" height="52" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
  <text class="box-t" x="366" y="548" text-anchor="middle" fill="#791F1F" font-size="13">部门公海</text>
  <text class="box-xs" x="366" y="567" text-anchor="middle">停留超部门设定时长</text>

  <line x1="456" y1="550" x2="492" y2="550" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="492" y="524" width="180" height="52" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
  <text class="box-t" x="582" y="548" text-anchor="middle" fill="#791F1F" font-size="13">公司公海</text>
  <text class="box-xs" x="582" y="567" text-anchor="middle">可被重新认领激活</text>

  <text class="box-xs" x="700" y="552" fill="#b45309">⚠ 客服 / 专员不触发掉落；</text>
  <text class="box-xs" x="700" y="570" fill="#b45309">掉落前 24h 预警、不「悄悄掉」</text>

  <!-- ============ SECTION 3: 组织与权限 ============ -->
  <text class="sec-title" x="40" y="628">③ 组织角色与数据权限</text>

  <!-- hierarchy -->
  <rect x="70" y="650" width="150" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
  <text class="box-t" x="145" y="678" text-anchor="middle" fill="#3C3489">总经理</text>

  <line x1="145" y1="696" x2="110" y2="716" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="145" y1="696" x2="330" y2="716" stroke="#9ca3af" stroke-width="1.2"/>

  <rect x="40" y="718" width="140" height="44" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text class="box-t" x="110" y="745" text-anchor="middle" fill="#3C3489" font-size="13">经理 A</text>

  <rect x="260" y="718" width="140" height="44" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text class="box-t" x="330" y="745" text-anchor="middle" fill="#3C3489" font-size="13">经理 B</text>

  <line x1="110" y1="762" x2="110" y2="780" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="330" y1="762" x2="330" y2="780" stroke="#9ca3af" stroke-width="1.2"/>

  <rect x="36" y="782" width="148" height="40" rx="8" fill="#f3f0fd" stroke="#534AB7" stroke-width="1"/>
  <text class="box-xs" x="110" y="806" text-anchor="middle" fill="#3C3489">销售 / 客服 / 交付 / 行政</text>
  <rect x="256" y="782" width="148" height="40" rx="8" fill="#f3f0fd" stroke="#534AB7" stroke-width="1"/>
  <text class="box-xs" x="330" y="806" text-anchor="middle" fill="#3C3489">销售 / 客服 / 交付 / 行政</text>

  <text class="box-xs" x="60" y="850" fill="#9ca3af">部门 ↔ 产品线 = 多对多；总经理 ↔ 经理 = 多对多</text>

  <!-- permission note -->
  <rect x="470" y="650" width="690" height="210" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <text class="note-b" x="490" y="678">数据权限矩阵（核心规则）</text>
  <text class="note" x="490" y="704">• 销售 = 本人数据 ｜ 经理 = 本部门 ｜ 总经理 = 全公司</text>
  <text class="note" x="490" y="730">• 跨业务线 / 跨部门 自动脱敏：</text>
  <text class="note" x="510" y="752">— 合同金额：完全脱敏（不显示数字）</text>
  <text class="note" x="510" y="774">— 续约日期：仅显示「还剩 X 月」</text>
  <text class="note" x="510" y="796">— 跟单内容：仅「近 N 天跟进 M 次」</text>
  <text class="note" x="510" y="818">— 工单详情：仅「N 个工单进行中」</text>
  <text class="note" x="490" y="844">• 对接人姓名 / 电话：始终全可见（客情不脱敏）</text>

  <!-- ============ SECTION 4: 技术架构 ============ -->
  <text class="sec-title" x="40" y="908">④ 技术架构分层（推荐 B1 Laravel / 或 B2 NestJS）</text>

  <rect x="60" y="928" width="1080" height="50" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text class="box-t" x="80" y="952" fill="#633806">表现层（Frontend）</text>
  <text class="box-s" x="280" y="952">Vue 3 + Element Plus ｜ Web 后台 + 移动端工作台</text>

  <line x1="600" y1="978" x2="600" y2="992" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="60" y="994" width="1080" height="50" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text class="box-t" x="80" y="1018" fill="#633806">业务层（Backend）</text>
  <text class="box-s" x="280" y="1018">Laravel 11 / NestJS ｜ 权限 · 公海规则 · 工单 · 合同 · 报表（REST + OpenAPI）</text>

  <line x1="600" y1="1044" x2="600" y2="1058" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="60" y="1060" width="1080" height="50" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text class="box-t" x="80" y="1084" fill="#633806">数据层（Storage）</text>
  <text class="box-s" x="280" y="1084">MySQL 8（生成列唯一索引） + Redis（缓存 / 队列 / 定时掉公海） + MinIO / OSS（文件）</text>

  <line x1="600" y1="1110" x2="600" y2="1124" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="60" y="1126" width="1080" height="50" rx="10" fill="#fdf6e9" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="box-t" x="80" y="1150" fill="#633806">外部集成（V2）</text>
  <text class="box-s" x="280" y="1150">企业微信 / 钉钉 ｜ 短视频 / GEO 平台数据同步 ｜ 财务系统（介绍费分账）</text>

  <!-- ============ SECTION 5: 实施分期 ============ -->
  <text class="sec-title" x="40" y="1216">⑤ 实施分期 · MVP → V2</text>

  <!-- MVP -->
  <rect x="60" y="1236" width="540" height="300" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text class="box-t" x="84" y="1266" fill="#085041" font-size="15">第一期 · MVP（12 周，自研）</text>
  <text class="box-s" x="84" y="1288" fill="#0F6E56">目标：把「人和人的对接」做成可落地资产，先跑通核心闭环</text>

  <rect x="84" y="1304" width="492" height="56" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="note-b" x="98" y="1326" fill="#085041">P0 核心闭环</text>
  <text class="note" x="98" y="1348">组织架构 · 权限矩阵 · 联系人档案 · 公司档案 · 业务关系 · 三级公海 · 跟单记录</text>

  <rect x="84" y="1372" width="492" height="48" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="note-b" x="98" y="1392" fill="#085041">P1 增效</text>
  <text class="note" x="98" y="1412">公海自动掉落 · 出门登记 · 跟进提醒 · 数据看板（我的日报 / 部门月报）</text>

  <rect x="84" y="1432" width="492" height="48" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="note-b" x="98" y="1452" fill="#085041">P2 基础</text>
  <text class="note" x="98" y="1472">工单基础 · 合同基础 · 操作日志 · 联系人就职历史（跳槽 / 换公司）</text>

  <text class="box-xs" x="84" y="1500" fill="#0F6E56">MVP 不做：表单采集 / 第三方 API / 导出审批 / 离职交接 / 介绍费分账</text>

  <!-- V2 -->
  <rect x="620" y="1236" width="540" height="300" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
  <text class="box-t" x="644" y="1266" fill="#3C3489" font-size="15">第二期 · V2（8–10 周）</text>
  <text class="box-s" x="644" y="1288" fill="#534AB7">在 MVP 闭环稳定后，扩展采集、对接与自动化能力</text>

  <rect x="644" y="1304" width="492" height="56" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/>
  <text class="note-b" x="658" y="1326" fill="#3C3489">采集与导入</text>
  <text class="note" x="658" y="1348">调研表单自动采集 · 批量导入工具（Excel / CSV）</text>

  <rect x="644" y="1372" width="492" height="56" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/>
  <text class="note-b" x="658" y="1394" fill="#3C3489">外部对接</text>
  <text class="note" x="658" y="1416">企微 / 钉钉对接 · 短视频 / GEO 平台数据同步 · 财务系统</text>

  <rect x="644" y="1440" width="492" height="56" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="0.8"/>
  <text class="note-b" x="658" y="1462" fill="#3C3489">治理与分账</text>
  <text class="note" x="658" y="1484">数据导出审批 + 离职交接 · 抢单介绍费自动分账 · 高级报表</text>

  <text class="box-xs" x="644" y="1512" fill="#534AB7">建议：先选 1 个部门试点运行 4 周，再全公司铺开</text>

</svg>

  <p style="text-align:center;font-size:11px;color:#9ca3af;margin-top:14px;">本图依据《销售CRM开发需求 V2.0》《项目摘要》《技术栈方案对比》整理 · 可作为需求评审 / 启动大会讲解底图</p>
</div>
</body>
</html>
